name: ImpactWeave test plan

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ImpactWeave
        run: python -m pip install .
      - name: Build conservative plan
        run: >-
          impactweave test-plan fixtures/test-plan.yaml
          --repo .
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --format sarif
          --output impactweave-test-plan.sarif
      - name: Upload plan findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: impactweave-test-plan.sarif
