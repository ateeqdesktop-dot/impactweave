[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impactweave"
version = "0.3.0"
description = "Local-first, deterministic change-impact analysis and safe test selection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Manus AI"}]
keywords = ["ci", "developer-tools", "test-selection", "change-impact", "sarif", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/ateeqdesktop-dot/impactweave"
Repository = "https://github.com/ateeqdesktop-dot/impactweave"
Issues = "https://github.com/ateeqdesktop-dot/impactweave/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "types-PyYAML>=6.0,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
impactweave = "impactweave.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/impactweave"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=impactweave --cov-report=term-missing --cov-fail-under=90"
