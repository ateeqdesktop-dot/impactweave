[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impactweave"
version = "0.2.0"
description = "Explainable, deterministic change-impact decisions for AI-enabled systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Manus AI"}]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "types-PyYAML>=6.0,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
impactweave = "impactweave.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/impactweave"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=impactweave --cov-report=term-missing --cov-fail-under=90"
